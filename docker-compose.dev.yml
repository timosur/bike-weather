services:
  db:
    image: postgres:16-alpine
    container_name: bikeweather-db-dev
    environment:
      POSTGRES_USER: bike
      POSTGRES_PASSWORD: bike
      POSTGRES_DB: bikeweather
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike -d bikeweather"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
