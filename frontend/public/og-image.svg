<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fafaf9"/>
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Cyclist icon (centered, scaled up from 32x32 favicon) -->
  <g transform="translate(460, 50) scale(8)">
    <!-- Bike wheels -->
    <path d="M25,30a6,6,0,1,1,6-6A6.0069,6.0069,0,0,1,25,30Zm0-10a4,4,0,1,0,4,4A4.0045,4.0045,0,0,0,25,20Z" fill="#059669"/>
    <path d="M7,30a6,6,0,1,1,6-6A6.0069,6.0069,0,0,1,7,30ZM7,20a4,4,0,1,0,4,4A4.0045,4.0045,0,0,0,7,20Z" fill="#059669"/>
    <!-- Rider + frame -->
    <path d="M17,27H15V20.4139L9.5849,15a2.003,2.003,0,0,1,0-2.8292l4.5859-4.5859a2.0024,2.0024,0,0,1,2.8286,0L21.414,12H27v1.9993L20.5853,14l-5-5L11,13.5849l6,6Z" fill="#059669"/>
    <!-- Head -->
    <path d="M21.5,8A3.5,3.5,0,1,1,25,4.5,3.5042,3.5042,0,0,1,21.5,8Zm0-5A1.5,1.5,0,1,0,23,4.5,1.5017,1.5017,0,0,0,21.5,3Z" fill="#059669"/>
  </g>

  <!-- Sun -->
  <g transform="translate(780, 140)">
    <circle cx="0" cy="0" r="30" fill="#f59e0b"/>
    <line x1="0" y1="-45" x2="0" y2="-38" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="0" y2="45" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="-45" y1="0" x2="-38" y2="0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="0" x2="45" y2="0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="-32" y1="-32" x2="-27" y2="-27" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="27" y1="-27" x2="32" y2="-32" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="-32" y1="32" x2="-27" y2="27" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <line x1="27" y1="27" x2="32" y2="32" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title text -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#1c1917">Fahrrad Wetter</text>
  <text x="600" y="540" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#78716c">Wetterbasierte Kleidungsempfehlungen für Radfahrer</text>

  <!-- Bottom accent line -->
  <rect x="0" y="618" width="1200" height="12" fill="#059669"/>
</svg>
