[project]
name = "bike-weather-agent"
version = "0.1.0"
description = "LLM-powered product agent for Bike Weather"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.0.0",
  "anthropic>=0.40.0",
  "beautifulsoup4>=4.12.0",
  "markdownify>=0.13.0",
  "playwright>=1.40.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.22.0",
  "coverage>=7.6.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "agent" = "." }
packages = ["agent", "agent.shops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
